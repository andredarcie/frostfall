name: Build and Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_RELEASE_TAG: 4.6-stable
  GODOT_TEMPLATE_VERSION: 4.6.stable
  GODOT_PROJECT_PATH: .
  GODOT_EXPORT_NAME: index.html
  GODOT_EXPORT_PRESET: Web
  GODOT_BUILD_DIR: build/web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$HOME/bin"

          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install "/tmp/godot/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64" "$HOME/bin/godot"

          curl -L -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_export_templates.tpz"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GODOT_BUILD_DIR}"
          godot --headless --path "${GODOT_PROJECT_PATH}" --export-release "${GODOT_EXPORT_PRESET}" "${GODOT_BUILD_DIR}/${GODOT_EXPORT_NAME}"
          touch "${GODOT_BUILD_DIR}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.GODOT_BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
